<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#182033}
header{background:#fff;border-bottom:1px solid #e6e9f0;padding:18px 20px;position:sticky;top:0;z-index:5}
.brand{font-size:24px;font-weight:800}.brand span{font-weight:400;color:#667085}
nav{display:flex;gap:8px;margin-top:14px;overflow:auto}nav button{border:0;background:#f0f2f7;padding:10px 15px;border-radius:12px;font-weight:700;color:#667085;white-space:nowrap}nav button.active{background:#182033;color:#fff}
main{max-width:900px;margin:auto;padding:22px 18px 50px}.page{display:none}.page.active{display:block}
.hero{background:#182033;color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#cbd2df}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e8ebf1;border-radius:18px;padding:18px;box-shadow:0 4px 15px #1820330a}.stat{font-size:30px;font-weight:800}.muted{color:#667085;font-size:14px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-title h2{margin:0;font-size:19px}
.subject{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.bar{height:8px;background:#edf0f5;border-radius:8px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#182033;border-radius:8px}
.task{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f4}.task:last-child{border:0}.task input{width:20px;height:20px}.done{text-decoration:line-through;color:#98a2b3}
input[type=text],textarea,select{width:100%;padding:12px;border:1px solid #dfe3eb;border-radius:12px;font:inherit;margin-bottom:10px}textarea{min-height:170px;resize:vertical}
button.primary{border:0;background:#182033;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}.danger{border:0;background:#fff0f0;color:#b42318;padding:8px 11px;border-radius:10px}
.timer{text-align:center;padding:28px}.time{font-size:64px;font-weight:800;letter-spacing:2px}.timer button{margin:5px}
.chip{display:inline-block;background:#eef1f6;padding:6px 10px;border-radius:99px;font-size:13px;margin:3px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}nav{margin-top:0;float:right;position:relative;top:-34px}header{padding:18px calc((100% - 860px)/2 + 18px)}}
</style>
</head>
<body>
<header>
  <div class="brand">Study<span>Flow</span></div>
  <nav>
    <button class="active" onclick="show('home',this)">Dashboard</button>
    <button onclick="show('tasks',this)">Tasks</button>
    <button onclick="show('timer',this)">Timer</button>
    <button onclick="show('notes',this)">Notes</button>
  </nav>
</header>

<main>
<section id="home" class="page active">
  <div class="hero"><h1>Ready to study? 🎯</h1><p>Build a little progress every day.</p></div>
  <div class="grid">
    <div class="card"><div class="stat" id="doneCount">0</div><div class="muted">Tasks completed</div></div>
    <div class="card"><div class="stat" id="totalCount">0</div><div class="muted">Tasks planned</div></div>
    <div class="card"><div class="stat" id="minutesCount">0</div><div class="muted">Study minutes</div></div>
    <div class="card"><div class="stat" id="progressCount">0%</div><div class="muted">Overall progress</div></div>
  </div>
  <div class="section-title"><h2>Subjects</h2></div>
  <div class="card" id="subjects"></div>
  <div class="section-title"><h2>Today's tasks</h2><button class="primary" onclick="show('tasks')">Manage</button></div>
  <div class="card" id="todayTasks"></div>
</section>

<section id="tasks" class="page">
  <div class="section-title"><h2>Study tasks</h2></div>
  <div class="card">
    <input id="newTask" type="text" placeholder="Add a task, e.g. Review chapter 3">
    <select id="subjectSelect"><option>Math</option><option>Science</option><option>English</option><option>History</option></select>
    <button class="primary" onclick="addTask()">Add task</button>
  </div>
  <div class="card" style="margin-top:14px" id="allTasks"></div>
</section>

<section id="timer" class="page">
  <div class="card timer">
    <div class="muted">FOCUS SESSION</div>
    <div class="time" id="clock">25:00</div>
    <div><button class="primary" onclick="startTimer()">Start</button><button class="primary" onclick="pauseTimer()">Pause</button><button class="danger" onclick="resetTimer()">Reset</button></div>
    <p class="muted">A completed session adds 25 study minutes.</p>
  </div>
</section>

<section id="notes" class="page">
  <div class="section-title"><h2>My notes</h2></div>
  <div class="card">
    <textarea id="notesBox" placeholder="Write your study notes here..."></textarea>
    <button class="primary" onclick="saveNotes()">Save notes</button>
    <span id="saved" class="muted" style="margin-left:10px"></span>
  </div>
</section>
</main>

<script>
const KEY='studyflow_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 tasks:[
  {text:'Review algebra formulas',subject:'Math',done:false},
  {text:'Read science chapter 2',subject:'Science',done:false},
  {text:'Write English outline',subject:'English',done:false}
 ],minutes:0,notes:''
};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function show(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(btn){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
 render();
}
function toggle(i){data.tasks[i].done=!data.tasks[i].done;save()}
function addTask(){
 const el=document.getElementById('newTask'); const text=el.value.trim(); if(!text)return;
 data.tasks.push({text,subject:document.getElementById('subjectSelect').value,done:false});el.value='';save();
}
function removeTask(i){data.tasks.splice(i,1);save()}
function render(){
 const done=data.tasks.filter(t=>t.done).length,total=data.tasks.length;
 document.getElementById('doneCount').textContent=done;document.getElementById('totalCount').textContent=total;
 document.getElementById('minutesCount').textContent=data.minutes;document.getElementById('progressCount').textContent=total?Math.round(done/total*100)+'%':'0%';
 const subjects=['Math','Science','English','History'];
 document.getElementById('subjects').innerHTML=subjects.map(s=>{
  const a=data.tasks.filter(t=>t.subject===s),d=a.filter(t=>t.done).length,p=a.length?Math.round(d/a.length*100):0;
  return `<div class="subject"><span><b>${s}</b> <span class="muted">${d}/${a.length}</span></span><span>${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div>`;
 }).join('');
 document.getElementById('allTasks').innerHTML=data.tasks.length?data.tasks.map((t,i)=>taskHTML(t,i)).join(''):'<p class="muted">No tasks yet. Add one above.</p>';
 document.getElementById('todayTasks').innerHTML=data.tasks.slice(0,5).map((t,i)=>taskHTML(t,i)).join('')||'<p class="muted">Your task list is empty.</p>';
 document.getElementById('notesBox').value=data.notes;
}
function taskHTML(t,i){return `<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})"><div style="flex:1"><div class="${t.done?'done':''}">${esc(t.text)}</div><span class="chip">${t.subject}</span></div><button class="danger" onclick="removeTask(${i})">Delete</button></div>`}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function saveNotes(){data.notes=document.getElementById('notesBox').value;save();document.getElementById('saved').textContent='Saved ✓';setTimeout(()=>document.getElementById('saved').textContent='',1200)}
let seconds=1500,interval=null;
function updateClock(){document.getElementById('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function startTimer(){if(interval)return;interval=setInterval(()=>{if(seconds>0){seconds--;updateClock()}else{clearInterval(interval);interval=null;data.minutes+=25;save();alert('Great work! 25 study minutes added.')}} ,1000)}
function pauseTimer(){clearInterval(interval);interval=null}
function resetTimer(){pauseTimer();seconds=1500;updateClock()}
render();
</script>
</body>
</html>
